server {
    listen 80;
    listen [::]:80;
    server_name yoyopod.com www.yoyopod.com;

    root /opt/yoyopod-web/current/root;
    index index.html;

    access_log /var/log/nginx/yoyopod.com.access.log;
    error_log /var/log/nginx/yoyopod.com.error.log;

    location = /api/notify {
        # Collection stays closed until the contact mailbox, hosting AVV, and
        # retention procedure are ready. See docs/operations/WEB_DEPLOY.md.
        return 404;
    }

    # Astro asset names are content-addressed and safe to cache permanently.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.yoyopod.com;

    root /opt/yoyopod-web/current/docs;
    index index.html;

    access_log /var/log/nginx/docs.yoyopod.com.access.log;
    error_log /var/log/nginx/docs.yoyopod.com.error.log;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}

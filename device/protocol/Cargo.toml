[package]
name = "yoyopod-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["process", "signal"] }

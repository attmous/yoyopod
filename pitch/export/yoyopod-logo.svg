<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="logo-title logo-description">
	<title id="logo-title">YoYoPod Family Loop logo</title>
	<desc id="logo-description">Two people joined by a continuous loop through a central pod.</desc>
	<!-- Two family members: distinct, equal, and intentionally abstract. -->
	<circle cx="24" cy="25" r="8" fill="#F37767"/>
	<circle cx="72" cy="25" r="8" fill="#05CAE9"/>
	<!-- One unbroken line: family connection, audio signal, and yoyo string. -->
	<path
		d="M48 58c-9.5-16.5-32-17.5-32 0s22.5 16.5 32 0 32-17.5 32 0-22.5 16.5-32 0Z"
		fill="none"
		stroke="#F8EADC"
		stroke-width="12"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<path
		d="M48 58c-9.5-16.5-32-17.5-32 0s22.5 16.5 32 0 32-17.5 32 0-22.5 16.5-32 0Z"
		fill="none"
		stroke="#1B1B1F"
		stroke-width="8"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<!-- The pod sits at the shared center instead of belonging to either side. -->
	<circle cx="48" cy="58" r="10" fill="#F8EADC"/>
	<circle cx="48" cy="58" r="7" fill="#00B978"/>
	<circle cx="48" cy="58" r="2.5" fill="#F8EADC"/>
</svg>

name: Web

on:
  pull_request:
    paths:
      - 'www/**'
      - 'docsite/website-vision/**'
      - 'deploy/web/**'
      - 'scripts/build_web.mjs'
      - 'scripts/deploy_web.ps1'
      - '.github/workflows/web.yml'
      - '.github/workflows/web-deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [www, docsite/website-vision]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '${{ matrix.dir }}/package-lock.json'
      - run: npm ci
        working-directory: ${{ matrix.dir }}
      - run: npm run build
        working-directory: ${{ matrix.dir }}

  deploy-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy shell syntax
        run: bash -n deploy/web/bootstrap-vps.sh deploy/web/install-release.sh deploy/web/ssh-command.sh
      - name: Check PowerShell deploy syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create(
            (Get-Content -Raw scripts/deploy_web.ps1)
          )
